server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: est-library-service

  datasource:
    url: jdbc:mysql://localhost:3306/est_library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.usmba.ac.ma
    port: 587
    username: ${SMTP_USERNAME:bibliotheque.est@usmba.ac.ma}
    password: ${SMTP_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

library:
  default-loan-duration-days: 14
  max-loans-per-student: 3
  thresholds:
    low: 1
    medium: 4
    high: 8
